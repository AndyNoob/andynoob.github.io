<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AndyNoob · Projects</title>
    <style>
      * {
        box-sizing: border-box;
      }

      :root {
        color-scheme: dark;
      }

      body {
        margin: 0;
        min-height: 100svh;
        font-family: Lato, sans-serif;
        color: #fff;
        background: #1f1f1f url('/pictures/background_rotated.png') center / cover fixed;
      }

      body::before {
        content: '';
        position: fixed;
        inset: 0;
        background: rgba(8, 12, 18, 0.72);
        z-index: -1;
      }

      .page {
        width: min(1100px, 100% - 2rem);
        margin: 1.25rem auto 2rem;
        display: grid;
        gap: 1rem;
      }

      .headline {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
        flex-wrap: wrap;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 6vw, 3.4rem);
      }

      .headline a {
        color: #9bd8ff;
        text-decoration: none;
        border-bottom: 1px solid rgba(155, 216, 255, 0.7);
      }

      .filters {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
      }

      .filters button {
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.25);
        background: rgba(0, 0, 0, 0.35);
        color: #f3faff;
        padding: 0.35rem 0.75rem;
        cursor: pointer;
      }

      .filters button[data-active] {
        background: #b9e8ff;
        color: #0a1a28;
        border-color: #d4efff;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 1rem;
      }

      .card {
        border-radius: 1rem;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.2);
        background: rgba(20, 20, 20, 0.8);
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
      }

      .card img {
        width: 100%;
        height: 170px;
        object-fit: cover;
        background: #242424;
        display: block;
      }

      .card-content {
        padding: 0.9rem;
        display: grid;
        gap: 0.6rem;
      }

      .topline {
        display: flex;
        justify-content: space-between;
        gap: 0.75rem;
      }

      .topline h2 {
        margin: 0;
        font-size: 1.15rem;
      }

      .status {
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 999px;
        padding: 0.15rem 0.45rem;
        font-size: 0.72rem;
        text-transform: uppercase;
      }

      p {
        margin: 0;
        line-height: 1.4;
      }

      .chips,
      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
      }

      .chips span {
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.12);
        padding: 0.2rem 0.5rem;
        font-size: 0.88rem;
      }

      .links a {
        color: #9bd8ff;
        text-decoration: none;
        border-bottom: 1px solid rgba(155, 216, 255, 0.7);
      }

      .empty {
        opacity: 0.85;
      }

      @media (max-width: 980px) {
        .grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 700px) {
        .page {
          width: min(1100px, 100% - 1rem);
          margin-top: 0.75rem;
        }

        .grid {
          grid-template-columns: minmax(0, 1fr);
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header class="headline">
        <h1>Projects</h1>
        <a href="/#/projects">Back to home section</a>
      </header>
      <div class="filters" role="toolbar" aria-label="Project filters"></div>
      <section class="grid" id="projects-grid" aria-live="polite"></section>
    </main>

    <script>
      const filtersEl = document.querySelector('.filters')
      const gridEl = document.getElementById('projects-grid')

      let allProjects = []
      let selectedTag = 'all'

      const statusText = (status) => String(status || '').trim()

      function makeTagButton(tag) {
        const button = document.createElement('button')
        button.type = 'button'
        button.textContent = tag
        if (tag === selectedTag) {
          button.dataset.active = 'true'
        }
        button.addEventListener('click', () => {
          selectedTag = tag
          renderFilters()
          renderGrid()
        })
        return button
      }

      function renderFilters() {
        const tagSet = new Set(['all'])
        allProjects.forEach((project) => {
          ;(Array.isArray(project.tags) ? project.tags : []).forEach((tag) => {
            if (typeof tag === 'string' && tag.trim()) {
              tagSet.add(tag)
            }
          })
        })

        const tags = Array.from(tagSet)
        filtersEl.replaceChildren(...tags.map((tag) => makeTagButton(tag)))
      }

      function makeLink(label, href, isExternal) {
        if (typeof href !== 'string' || !href.trim()) {
          return null
        }

        const link = document.createElement('a')
        link.href = href
        link.textContent = label

        if (isExternal) {
          link.target = '_blank'
          link.rel = 'noreferrer'
        }

        return link
      }

      function makeCard(project) {
        const card = document.createElement('article')
        card.className = 'card'

        const image = document.createElement('img')
        image.src = typeof project.thumbnail === 'string' ? project.thumbnail : ''
        image.alt = `${project.title || 'Project'} preview`
        image.loading = 'lazy'

        const content = document.createElement('div')
        content.className = 'card-content'

        const topline = document.createElement('div')
        topline.className = 'topline'

        const title = document.createElement('h2')
        title.textContent = typeof project.title === 'string' ? project.title : 'Untitled project'

        const status = document.createElement('span')
        status.className = 'status'
        status.textContent = statusText(project.status)

        topline.append(title, status)

        const summary = document.createElement('p')
        summary.textContent = typeof project.summary === 'string' ? project.summary : ''

        const chips = document.createElement('div')
        chips.className = 'chips'

        const tech = Array.isArray(project.tech) ? project.tech : []
        const tags = Array.isArray(project.tags) ? project.tags : []
        tech.forEach((item) => {
          if (typeof item !== 'string') return
          const chip = document.createElement('span')
          chip.textContent = item
          chips.appendChild(chip)
        })
        tags.forEach((item) => {
          if (typeof item !== 'string') return
          const chip = document.createElement('span')
          chip.textContent = `#${item}`
          chips.appendChild(chip)
        })

        const links = document.createElement('div')
        links.className = 'links'
        const projectLinks = project.links && typeof project.links === 'object' ? project.links : {}

        const live = makeLink('Live', projectLinks.live, true)
        const source = makeLink('Source', projectLinks.source, true)
        const demo = makeLink('Demo', projectLinks.demo, false)

        if (live) links.appendChild(live)
        if (source) links.appendChild(source)
        if (demo) links.appendChild(demo)

        content.append(topline, summary, chips, links)
        card.append(image, content)
        return card
      }

      function renderGrid() {
        const visible =
          selectedTag === 'all'
            ? allProjects
            : allProjects.filter((project) =>
                Array.isArray(project.tags) ? project.tags.includes(selectedTag) : false
              )

        if (visible.length === 0) {
          const empty = document.createElement('p')
          empty.className = 'empty'
          empty.textContent = 'No projects found for this category.'
          gridEl.replaceChildren(empty)
          return
        }

        gridEl.replaceChildren(...visible.map((project) => makeCard(project)))
      }

      async function init() {
        try {
          const response = await fetch('/data/projects.json')
          if (!response.ok) {
            throw new Error('Failed to load project data.')
          }

          const payload = await response.json()
          allProjects = Array.isArray(payload) ? payload : []
          renderFilters()
          renderGrid()
        } catch {
          const empty = document.createElement('p')
          empty.className = 'empty'
          empty.textContent = 'Unable to load projects right now. Please try again later.'
          gridEl.replaceChildren(empty)
        }
      }

      init()
    </script>
  </body>
</html>
